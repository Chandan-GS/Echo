name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'Echo*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release

    - name: Rename APK
      run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Echo-1.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Echo-android-apk
        path: build/app/outputs/flutter-apk/Echo-1.0.0.apk

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/Echo-1.0.0.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Build Windows Executable
      run: flutter build windows

    - name: Package Windows Build
      shell: pwsh
      run: |
        if (Test-Path "build\windows\x64\runner\Release") {
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\Echo-windows.zip -Force
        } elseif (Test-Path "build\windows\runner\Release") {
          Compress-Archive -Path build\windows\runner\Release\* -DestinationPath build\Echo-windows.zip -Force
        }

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Echo-windows-build
        path: |
          build/Echo-windows.zip
          build/windows/x64/runner/Release/
          build/windows/runner/Release/

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && hashFiles('build/Echo-windows.zip') != ''
      uses: softprops/action-gh-release@v2
      with:
        files: build/Echo-windows.zip
