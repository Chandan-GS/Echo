org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Some third-party plugins (tflite_flutter, flutter_tts) compile Java at 11 but
# Kotlin at 17. Their bytecode dexes fine for our minSdk, so downgrade the
# strict JVM-target consistency check from an error to a warning.
kotlin.jvm.target.validation.mode=warning
# The bundled ML Kit barcode model ships a 4 KB-aligned native library, which
# Play rejects (16 KB page sizes). The unbundled one comes from Play services
# instead, and only the desktop pairing QR scan uses it.
dev.steenbakker.mobile_scanner.useUnbundled=true
